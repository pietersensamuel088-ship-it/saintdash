<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Cyber Hexagon / Shield Frame -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" 
           fill="#0b0e17" 
           stroke="url(#cyberGrad)" 
           stroke-width="3" 
           filter="url(#glow)"/>
           
  <!-- Inner Circuit Lines -->
  <line x1="32" y1="4" x2="32" y2="20" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="6" y1="18" x2="20" y2="28" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="58" y1="18" x2="44" y2="28" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="32" y1="60" x2="32" y2="44" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- SaintDash "SD" Monogram -->
  <text x="32" y="38" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-weight="900" 
        font-size="20" 
        fill="#ffffff" 
        letter-spacing="0.5">
    SD
  </text>
  
  <!-- Glowing Status Core Dot -->
  <circle cx="32" cy="46" r="2.5" fill="#10b981" filter="url(#glow)"/>
</svg>
